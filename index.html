<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okayu Nekomata x osu! Live Stats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Твое локальное фото Окаю из папки -->
        <img src="okayu.jpg" alt="Okayu Nekomata" class="character-img">
        
        <h1>Statixcx x Okayu</h1>
        <div class="subtitle">Mogu Mogu! Авто-обновление статистики</div>

        <!-- Кнопка раскрытия статистики -->
        <button class="btn-toggle" id="toggleBtn">Показать статистику</button>

        <!-- Блок со статистикой -->
        <div class="stats-container" id="statsBlock">
            
            <!-- Официальная живая карточка-информер Mikubot. Она берёт данные прямо из базы osu! -->
            <object 
                id="osuWidget"
                data="https://ppy.sh" 
                type="image/png" 
                class="osu-iframe-widget">
                <!-- Резервная прямая ссылка-картинка, которая обновляется без кэша -->
                <img id="osuImg" src="https://vtop.site" alt="osu! stats" style="width:100%; border-radius:10px;">
            </object>
            
            <!-- Единственная точная ссылка на профиль под всей статистикой -->
            <a href="https://ppy.sh" target="_blank" rel="noopener noreferrer" class="profile-link">Открыть оригинальный профиль osu!</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
