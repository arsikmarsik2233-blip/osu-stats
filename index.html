<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okayu Nekomata x osu! Live Stats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Твое локальное фото Окаю из папки -->
        <img src="okayu.jpg" alt="Okayu Nekomata" class="character-img">
        
        <h1>Statixcx x Okayu</h1>
        <div class="subtitle">Mogu Mogu! Авто-обновление статистики</div>

        <!-- Кнопка раскрытия статистики -->
        <button class="btn-toggle" id="toggleBtn">Показать статистику</button>

        <!-- Блок со статистикой -->
        <div class="stats-container" id="statsBlock">
            <!-- Индикатор загрузки данных -->
            <div id="loading" class="loading-text">Синхронизация с osu! сервером...</div>
            
            <!-- Красивый текстовый блок со статами -->
            <div id="statsContent" style="display: none; width: 100%;">
                <div class="stat-item">
                    <span class="stat-label">Игрок:</span>
                    <span class="stat-value" id="username">Statixcx</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Рейтинг в мире (Global):</span>
                    <span class="stat-value" id="globalRank" style="color: #ffb4e6;">#151 388</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Точность (Accuracy):</span>
                    <span class="stat-value" id="accuracy">98.66%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Количество игр (Playcount):</span>
                    <span class="stat-value" id="playcount">16 854</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Рейтинговые очки (PP):</span>
                    <span class="stat-value" id="pp" style="color: #bda2ff; font-weight: 900;">4 332 pp</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Текущий уровень (Level):</span>
                    <span class="stat-value" id="level">98</span>
                </div>
                
                <!-- Единственная точная ссылка на профиль под всей статистикой -->
                <a href="https://ppy.sh" target="_blank" rel="noopener noreferrer" class="profile-link">Открыть оригинальный профиль osu!</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
